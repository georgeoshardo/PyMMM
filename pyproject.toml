[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymmm"
version = "0.1.0"
description = "Mother machine image processing: ND2 to one OME-Zarr image per trench"
readme = "README.md"
authors = [{ name = "Georgeos Hardo", email = "gh464@cantab.ac.uk" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
# A plain install reads ND2s, runs the steps (registration, lanes, trenches,
# extraction) and reads and writes the experiment group.
dependencies = [
    "dask[distributed,diagnostics]",  # diagnostics: bokeh, for the Dask dashboard
    "matplotlib",                      # the steps' diagnostic figures
    "nd2",
    "numpy",
    "opencv-python-headless>=4.13",
    "pandas",
    "pystackreg",
    "scikit-image",
    "scipy",
    "tqdm",
    "xarray>=2026.2.0,<2027",
    "zarr>=3.1,<4",
]

[project.optional-dependencies]
# The steps' widgets (interactive_detect_lanes, interactive_detect_trenches,
# interactive_segment) and the ndv viewers, in Jupyter.
notebook = ["ipython", "ipywidgets", "ndv[jup]>=0.5,<0.6"]
# The Segmenter. Omnipose 2.0 is not on PyPI (1.1.4 needs zarr < 2.16): install it
# from git.
segment = ["omnipose", "torch"]
# pymmm.view, one trench image opened in napari as an OME-Zarr image, and the
# extraction dock's plots (pymmm.gui).
view = ["napari", "napari-ome-zarr", "pyqtgraph>=0.13,<1"]
# Tracking runs' GEFFs (trench_images.write_tracks).
tracks = ["geff>=1.3,<2"]

# napari finds PyMMM's reader here (pymmm/napari.yaml): drop an experiment group onto
# napari to open every trench on one slider.
[project.entry-points."napari.manifest"]
pymmm = "pymmm:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["pymmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# A test marked with an install extra is skipped without it (tests/conftest.py).
markers = [
    "golden: pins PyMMM's output on real data (tests/golden; needs the ty013 ND2)",
    "notebook: needs the notebook extra (ndv, ipywidgets): the widgets",
    "segment: needs the segment extra (omnipose, torch): the seg and GPU environments",
    "tracks: needs the tracks extra (geff)",
    "view: needs the view extra (napari)",
]

# Lint and format with ruff (`ruff check`, `ruff format`; run by the pre-commit hooks).
# The rule set is nd2's (github.com/tlambert03/nd2). The rules under "not yet" are
# switched off until the code is brought up to them.
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["pymmm", "tests"]

[tool.ruff.format]
# Leave the code blocks of README.md and the docs as written: their comments are aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused names, undefined names
    "D", "D417", # docstrings (numpy convention), every parameter documented
    "I",        # import order
    "UP",       # syntax for the oldest supported Python
    "S",        # bandit: security
    "C4",       # comprehensions
    "B",        # bugbear: likely bugs
    "A001",     # shadowing a builtin
    "RUF",      # ruff's own rules
    "SIM105",   # contextlib.suppress
    "TID",      # tidy imports
    "TC",       # imports needed only for type hints
]
ignore = [
    "D401",     # first line in the imperative mood (as nd2)
    "D100",     # module docstrings (as nd2)
    # not yet:
    "E501",     # lines longer than 88 characters; the formatter wraps code, not text
    "D102", "D103", "D105", "D107",  # a docstring on every public function and method
    "D205",     # a blank line after a docstring's first line
    "RUF001", "RUF002", "RUF003",    # µ, × and en dashes in strings and comments
    "B905",     # zip() without strict=: each call needs deciding
    "TC001", "TC002", "TC003",       # moving type-only imports under TYPE_CHECKING
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# The spell-checker run by the pre-commit hooks: words it would otherwise correct.
[tool.typos.default.extend-words]
nd = "nd"        # ND2, nd2
ome = "ome"      # OME-Zarr
fo = "fo"        # FOV
arange = "arange"
