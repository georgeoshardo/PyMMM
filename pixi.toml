[workspace]
authors = ["Georgeos Hardo <gh464@cantab.ac.uk>"]
channels = ["conda-forge"]
name = "PyMMM"
platforms = ["linux-64"]
version = "0.1.0"

# A development environment: PyMMM itself, editable, with the notebook, view and
# tracks extras, so its dependencies are those of pyproject.toml. The conda
# packages below only take the heavy ones from conda-forge rather than PyPI. The
# segment extra (omnipose, torch) is left out: phage-signatures' seg environment
# has omnipose 2.0 from git and PyTorch for the GPU.
[dependencies]
python = ">=3.11"
nd2 = "*"
xarray = ">=2026.2.0,<2027"
dask = "*"
distributed = "*"
bokeh = ">=3.1"
zarr = ">=3.1,<4"
numpy = "*"
scipy = "*"
pystackreg = "*"
scikit-image = "*"
matplotlib = "*"
tqdm = "*"
pandas = "*"
napari = "*"
pyqt = "*"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
pytest = "*"

[pypi-dependencies]
pymmm = { path = ".", editable = true, extras = ["notebook", "view", "tracks"] }

[tasks]
test = "python -m pytest tests -v"
notebook = "python -m jupyter lab"
