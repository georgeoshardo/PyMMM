[workspace]
authors = ["Georgeos Hardo <gh464@cantab.ac.uk>"]
channels = ["conda-forge"]
name = "PyMMM"
platforms = ["linux-64"]
version = "0.1.0"

# A development environment: PyMMM itself, editable, with the notebook, view and
# tracks extras, so its dependencies are those of pyproject.toml. The conda
# packages below only take the heavy ones from conda-forge rather than PyPI. The
# segment extra (omnipose, torch) is left out: it needs omnipose 2.0 from git and
# PyTorch for the GPU, which this environment does not install.
[dependencies]
python = ">=3.11"
nd2 = "*"
xarray = ">=2026.2.0,<2027"
dask = "*"
distributed = "*"
bokeh = ">=3.1"
zarr = ">=3.1,<4"
numpy = "*"
scipy = "*"
pystackreg = "*"
scikit-image = "*"
matplotlib = "*"
tqdm = "*"
pandas = "*"
napari = ">=0.10.0,<0.11"
jupyterlab = "*"
ipykernel = "*"
ipywidgets = "*"
pytest = "*"

[pypi-dependencies]
# napari 0.10 runs on Qt 6 only. PyQt6 from PyPI: conda-forge has only 6.8, whose
# right-hand dock splitters don't drag, and 6.11.0, which napari excludes.
pyqt6 = ">=6.9.1,<6.10"
pymmm = { path = ".", editable = true, extras = ["notebook", "view", "tracks"] }

[tasks]
test = "python -m pytest tests -v"
notebook = "python -m jupyter lab"
